[package]
name = "wow-alchemy-wdl"
version = "0.2.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/wow-alchemy-wdl"
description = "Reader and writer for World of Warcraft WDL (low-resolution world) files"
readme = "README.md"
keywords = ["wow", "warcraft", "wdl", "terrain", "gamedev"]
categories = ["game-development", "parser-implementations"]

[dependencies]
wow-alchemy-utils = { path = "../../../wow-alchemy-utils", version = "0.2.0" }
wow-alchemy-data = { path = "../../wow-alchemy-data", version = "0.2.0" }
wow-alchemy-data-derive = { path = "../../wow-alchemy-data-derive", version = "0.2.0" }
custom_debug = { workspace = true }

[dev-dependencies]
wow-alchemy-mpq = { path = "../../archives/wow-alchemy-mpq", version = "0.2.0" }

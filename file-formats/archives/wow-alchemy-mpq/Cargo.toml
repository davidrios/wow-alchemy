[package]
name = "wow-alchemy-mpq"
version = "0.2.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Reader and writer for World of Warcraft MPQ archives"
categories = ["game-development", "parser-implementations"]
keywords = ["wow", "warcraft", "mpq", "archive", "gamedev"]

[dependencies]
wow-alchemy-data = { path = "../../wow-alchemy-data", version = "0.2.0" }
wow-alchemy-data-derive = { path = "../../wow-alchemy-data-derive", version = "0.2.0" }
bitflags = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

# Checksums: (attributes), v4 table MD5s, patch verification and sector CRCs
md-5 = "0.10"
crc32fast = "1.4"
adler2 = "2.0"

# Compression codecs used by MPQ archives
flate2 = "1.1"
bzip2 = "0.6"
lzma-rs = "0.3"
pklib = "0.1"

[dev-dependencies]
tempfile = { workspace = true }

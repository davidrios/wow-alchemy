[package]
name = "wow-alchemy-blp"
version = "0.2.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/wow-alchemy-blp"
description = "Reader and writer for World of Warcraft BLP textures, with conversion to and from images"
readme = "README.md"
keywords = ["wow", "warcraft", "blp", "texture", "gamedev"]
categories = ["game-development", "parser-implementations"]

[dependencies]
wow-alchemy-data = { path = "../../wow-alchemy-data", version = "0.2.0" }
wow-alchemy-data-derive = { path = "../../wow-alchemy-data-derive", version = "0.2.0" }
custom_debug = { workspace = true }
thiserror = { workspace = true }
image = "0.25"
color_quant = "1.1"
texpresso = { version = "2.0", features = ["rayon"] }

[dev-dependencies]
tempfile = { workspace = true }
wow-alchemy-mpq = { path = "../../archives/wow-alchemy-mpq" }
